name: Build and Test LTR
# This workflow is triggered on pull requests and push to any branches
on:
  push:
    branches-ignore:
      - 'backport/**'
      - 'create-pull-request/**'
      - 'dependabot/**'
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  Get-CI-Image-Tag:
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@main
    with:
      product: opensearch

  spotless:
    if: github.repository == 'opensearch-project/opensearch-learning-to-rank-base'
    runs-on: ubuntu-latest
    strategy:
      # Let every matrix leg report independently. Branch protection requires the
      # java 21 checks, and fail-fast would cancel them when another leg fails.
      fail-fast: false
      matrix:
        java: [21]
    steps:
      - name: Checkout LTR
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # Spotless requires JDK 17+
      - name: Setup Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Spotless Check
        run: ./gradlew spotlessCheck

  Build-ltr-linux:
    needs: [Get-CI-Image-Tag, spotless]
    strategy:
      fail-fast: false
      matrix:
        java: [ 11, 17, 21 ]

    name: Build and Test LTR Plugin on Linux
    if: github.repository == 'opensearch-project/opensearch-learning-to-rank-base'
    runs-on: ubuntu-latest
    container:
      # using the same image which is used by opensearch-build team to build the OpenSearch Distribution
      # this image tag is subject to change as more dependencies and updates will arrive over time
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      # need to switch to root so that github actions can install runner binary on container without permission issues.
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}

    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Checkout LTR Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build and Run Tests
        run: |
          chown -R 1000:1000 `pwd`
          su `id -un 1000` -c 'whoami && java -version && 
                              ./gradlew -Dtests.security.manager=false clean test -x spotlessJava'


  Build-ltr-windows:
    strategy:
      fail-fast: false
      matrix:
        # java 11 is omitted on Windows: :validatePluginZipPom loads plexus-utils,
        # which ships class file version 61.0 (java 17) and cannot run on a java 11
        # JVM. Linux still covers java 11, so runtime support is unaffected.
        java: [ 17, 21 ]
    name: Build and Test LTR Plugin on Windows
    if: github.repository == 'opensearch-project/opensearch-learning-to-rank-base'
    needs: [spotless]
    runs-on: windows-latest
    steps:
      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Checkout LTR Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build and Run Tests
        shell: bash
        run: |
          ./gradlew.bat build -x spotlessJava